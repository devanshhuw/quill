</style></head><body>
<div id="app"></div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),K='notebook.v1';

let V={v:'home',id:null},drawer=0,ob={s:0,d:{},otp:null,err:'',hero:1};

function theme(){const s=S.set,d=s.theme==='dark'||(s.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches),r=document.documentElement;
r.dataset.t=d?'dark':'light';s.acu?r.style.setProperty('--ac',s.ac):r.style.removeProperty('--ac');r.style.setProperty('--w',s.w+'px');
const f={sans:'Figtree,system-ui,sans-serif',serif:'EB Garamond,Georgia,serif',mono:'JetBrains Mono,monospace'}[s.font];r.style.setProperty('--bf',f);r.style.setProperty('--mono','JetBrains Mono,monospace')}
function toast(m,u){const t=document.createElement('div');t.className='toast';t.textContent=m;if(u){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{u();t.remove()};t.append(b)}document.body.append(t);setTimeout(()=>t.remove(),4500)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pg=id=>S.pages.find(p=>p.id===id);
function newPage(o={}){const p={id:uid(),title:'',icon:'📄',parent:null,del:0,blocks:[B()],...o};S.pages.push(p);save();return p}
function open(id){V={v:'page',id};drawer=0;render()}
/* ---------- onboarding ---------- */
const PROF=['Student','Designer','Developer','Writer','Founder','Manager','Researcher','Other'],USE=['Notes','Tasks','Wiki','Journal','Projects'];
function renderOb(){if(ob.hero)return heroOb();const d=ob.d,s=ob.s,N=6;let h='';
const dots=`<div class="dots">${Array.from({length:N},(_,i)=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;
if(s===0)h=`<h2>What should we call you?</h2><input class="f" id="o-name" placeholder="Your name" value="${esc(d.name||'')}" autofocus>`;
if(s===1)h=`<h2>What do you do?</h2><div class="chips">${PROF.map(p=>`<button class="chip ${d.prof===p?'on':''}" data-prof="${p}">${p}</button>`).join('')}</div>${d.prof==='Other'?`<input class="f" id="o-other" placeholder="Tell us what you do" value="${esc(d.other||'')}">`:''}`;

if(s===3)h=`<h2>Enter the 6-digit code</h2><input class="f" id="o-otp" inputmode="numeric" maxlength="6" placeholder="000000"><div class="hint">Prototype only: your code is <b>${ob.otp}</b>. Replace sendOtp() and verifyOtp() with a real email-auth backend.</div><div><button data-a="chg">Change email</button> <button data-a="resend" id="rs" disabled>Resend in 30s</button></div>`;

if(s===5)h=`<h2>What will you use it for?</h2><div class="chips">${USE.map(u=>`<button class="chip ${(d.use||[]).includes(u)?'on':''}" data-use="${u}">${u}</button>`).join('')}</div>`;
$('#ov').innerHTML=`<div class="ob"><div class="obc">${dots}${h}<div class="err">${ob.err}</div><div style="display:flex;gap:8px;align-items:center">${s>0?'<button class="ghost" data-a="back" aria-label="Back">←</button>':''}<button class="pri" data-a="next" style="flex:1">${s===5?'Start writing':'Continue'}</button></div></div></div>`;
const f=$('.obc input');if(f)f.focus();
if(s===3){let n=30;const t=setInterval(()=>{const b=$('#rs');if(!b||ob.s!==3)return clearInterval(t);n--;b.textContent=n>0?`Resend in ${n}s`:'Resend code';b.disabled=n>0;if(n<=0)clearInterval(t)},1000)}}
function obNext(){const d=ob.d;ob.err='';
if(ob.s===0){d.name=$('#o-name').value.trim();if(!d.name)ob.err='Please enter your name.'}
else if(ob.s===1){if($('#o-other'))d.other=$('#o-other').value.trim();if(!d.prof)ob.err='Pick one to continue.';else if(d.prof==='Other'&&!d.other)ob.err='Tell us what you do.'}
else if(ob.s===2){d.mail=$('#o-mail').value.trim().toLowerCase();if(!/^[^\s@]+@gmail\.com$/.test(d.mail))ob.err='Enter an address that ends in @gmail.com.';else ob.otp=String(Math.floor(1e5+Math.random()*9e5))}
else if(ob.s===3){if($('#o-otp').value.trim()!==ob.otp)ob.err='That code doesn’t match. Check it and try again.'}
else if(ob.s===5){if(!(d.use||[]).length){ob.err='Pick at least one.';return renderOb()}return finish()}
if(!ob.err)ob.s++;renderOb();if(ob.s===4){S.set.theme=d.theme||'system';theme()}}
function finish(){const d=ob.d;S.p={name:d.name,prof:d.prof==='Other'?d.other:d.prof,mail:d.mail};S.set.theme=d.theme||'system';S.set.font=d.font||'sans';S.ob=1;
const T={Notes:['📝','Notes',['Capture ideas here. Type / for blocks.']],Tasks:['✅','To-do',['todo:Plan the week','todo:Reply to messages','todo:Something small and satisfying']],Wiki:['📚','Wiki home',['h2:How we work','b:Add a page for each process','b:Link related pages together']],Journal:['📔','Daily journal',['h2:Today','p:What happened?','h2:Grateful for','b:']],Projects:['🗂️','Project tracker',['h2:Goals','todo:Define scope','todo:Set first milestone','h2:Notes','p:']]};
const hello={Student:'Courses and deadlines',Designer:'Ideas and references',Developer:'Snippets and bugs',Writer:'Drafts and ideas',Founder:'Priorities and updates',Manager:'1:1s and priorities',Researcher:'Sources and findings'}[d.prof]||'Your first page';
newPage({title:'Start here',icon:'👋',blocks:[B('h2',hello),B('p','This page is yours. Type / to add blocks, or select text to format it.'),B('todo','Try the slash menu'),B('todo','Press Ctrl+K to search')]});
d.use.forEach(u=>{const [i,t,bs]=T[u];newPage({title:t,icon:i,blocks:bs.map(x=>{const [a,b]=x.includes(':')?x.split(/:(.*)/s):['p',x];return B(a,b)})})});
S.notes.push({id:uid(),x:'Welcome. Tap + to capture a quick note.',pin:1,tag:'start',ts:Date.now()});save();$('#ov').innerHTML='';V={v:'home'};render()}
/* ---------- shell ---------- */
function tree(par,dep=0){return S.pages.filter(p=>p.parent===par&&!p.del).map(p=>`<div style="padding-left:${dep*14}px"><button class="row ${V.id===p.id?'on':''}" data-open="${p.id}"><span>${p.icon}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.title||'Untitled')}</span></button></div>`+tree(p.id,dep+1)).join('')}
function render(){theme();if(!S.ob)return renderOb();
const favs=S.pages.filter(p=>S.fav.includes(p.id)&&!p.del);
$('#app').innerHTML=`<aside class="sb ${drawer?'open':''}" aria-label="Sidebar"><button class="ws" data-x="wsmenu" style="width:100%;text-align:left">${esc(S.ws.find(w=>w.id===S.cw).name)} ▾ <span id="sy" class="hint" style="float:right;font:12px var(--ui)">${syLabel()}</span></button>
<button class="row" data-v="search">🔍 Search <small class="hide-m" style="margin-left:auto;color:var(--mu)">Ctrl K</small></button>
<button class="row ${V.v==='home'?'on':''}" data-v="home">🏠 Home</button><button class="row ${V.v==='chat'?'on':''}" data-v="chat">💬 Chat <span id="cb" class="bdg">${cUn()||''}</span></button>

${favs.length?'<h6>Favorites</h6>'+favs.map(p=>`<button class="row" data-open="${p.id}">${p.icon} ${esc(p.title||'Untitled')}</button>`).join(''):''}
${wsTree()}<button class="row" data-a="newpage" style="color:var(--mu)">＋ New page</button>
<div style="flex:1"></div><button class="row" data-x="tools">${ICO.t} Tools</button>

<main id="main"></main>
<button class="fab" data-a="quick" aria-label="Quick note">+</button>
<nav class="tab"><button data-v="home" class="${V.v==='home'?'on':''}">🏠<br>Home</button><button data-v="search">🔍<br>Search</button><button data-a="newpage">✏️<br>New</button><button data-v="notes" class="${V.v==='notes'?'on':''}">🗒️<br>Notes</button><button data-a="menu">☰<br>Menu</button></nav>`;
view()}
function view(){const m=$('#main'),p=V.id&&pg(V.id);let h='';

if(V.v==='home'){const h0=new Date().getHours(),g=h0<12?'Good morning':h0<18?'Good afternoon':'Good evening',ps=S.pages.filter(x=>!x.del).sort((a,b)=>(b.ed||0)-(a.ed||0));

else if(V.v==='page'&&p){h=bar(`${p.icon} ${esc(p.title||'Untitled')}`)+`${p.cover?`<div class="cov" style="background:${p.cover}"><button data-x="cover">Change cover</button></div>`:''}<div class="col"><div class="ico" data-x="emoji" title="Change icon">${p.icon}</div><div class="pa">${p.cover?'':'<button data-x="cover">🖼 Add cover</button>'}</div><h1 class="ttl" id="ttl" contenteditable="plaintext-only" data-p="Untitled" spellcheck="false">${esc(p.title)}</h1>${propsHTML(p)}<div id="ed">${p.blocks.map(blk).join('')}</div><div class="hint" id="wc" style="margin-top:28px">${wcText(p)}</div>${cmHTML(p)}</div>`}

<div><div class="lbl">Font</div><div class="chips">${['sans','serif','mono'].map(t=>`<button class="chip ${s.font===t?'on':''}" data-fo2="${t}">${t}</button>`).join('')}</div></div>
<div><div class="lbl">Accent</div><div class="chips">${['default','#6A8CAF','#C4952F','#B5543A','#7A4FB0'].map(c=>`<button class="sw" data-ac="${c}" style="background:${c==='default'?'var(--ac)':c};${(s.acu?s.ac:'default')===c?'border-color:var(--tx)':''}" aria-label="Accent ${c}"></button>`).join('')}</div></div>
<div><div class="lbl">Content width</div><div class="chips">${[[640,'Narrow'],[720,'Default'],[920,'Wide']].map(([w,n])=>`<button class="chip ${s.w===w?'on':''}" data-w="${w}">${n}</button>`).join('')}</div></div>
<h3>Writing</h3><label class="hint" style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-x="nwtoggle" ${S.set.nw===0?'':'checked'}> Suggest the next word while I write</label><div class="hint">Learns from your own notes and recordings, on this device.</div>
<h3>Sync</h3><div class="hint" id="sys">${syLong()}</div><div class="chips" style="margin-top:8px">${syBtn()}</div><h3>Data</h3><div class="chips"><button class="chip" data-a="expall">Export everything</button><button class="chip" data-a="clear" style="color:#C0392B">Clear local data</button></div><div class="hint">Stored on this device only. About ${(JSON.stringify(S).length/1024).toFixed(1)} KB used.</div></div>`}

m.innerHTML=h;fixNums();if(V.v==='chat')cMount();if(V.v==='flow')flowMount()}
function blk(b){if(b.t==='img')return `<div class="imw" data-id="${b.id}"><img class="pimg" src="${b.x}" alt=""><button data-x="rmimg" data-id="${b.id}" aria-label="Remove image">✕</button></div>`;if(b.t==='hr')return`<hr data-id="${b.id}" tabindex="0">`;

const AI_SAMPLE=["Today we are talking about space exploration. The rocket left the launch pad at dawn and climbed toward orbit. Engineers at mission control watched the data on their screens as the first stage separated. The crew onboard the spacecraft reported that everything was normal. After a few minutes the capsule reached orbit around the earth, and the astronauts began to prepare the telescope for the long mission ahead.","The telescope has changed how we see the universe. It collects light from distant stars and galaxies, and astronomers study that light to learn how old the universe is. Last year the telescope found a planet orbiting a star far from our solar system. The planet is slightly larger than the earth, and scientists want to know whether the planet has water and an atmosphere.","Astronauts live and work on the space station for six months at a time. The station orbits the earth every ninety minutes, so the crew sees sixteen sunrises every day. They run experiments in microgravity, exercise for two hours every day to protect their bones, and repair equipment outside the station during a spacewalk. Mission control talks to the crew every day to plan the work.","The next mission will send a rover to mars. The rover will drill into the rock and collect samples to search for signs of ancient life. The spacecraft will travel for seven months before it lands on the surface of the planet. Engineers designed the heat shield and the parachute to slow the capsule as it enters the thin atmosphere, and mission control will guide the landing.","To make a good tomato sauce, start by heating olive oil in a large pan. Add chopped onion and garlic and cook them slowly until they are soft. Then add the tomatoes, a pinch of salt and a handful of fresh basil. Let the sauce simmer on low heat for thirty minutes, stirring from time to time, and serve it over hot pasta with grated cheese.","Baking bread at home is easier than you think. Mix flour, water, yeast and a little salt in a large bowl, then knead the dough for ten minutes. Cover the dough and let it rise in a warm place for one hour. Heat the oven to high heat, shape the dough, and bake the loaf until the crust is golden brown.","When you roast a chicken, season the chicken well with salt, pepper and fresh herbs. Place it in a hot oven and roast it for about an hour, until the skin is crispy and the juices run clear. Let the chicken rest for ten minutes before you cut it, and serve it with roasted potatoes and a simple salad with olive oil.","A good soup starts with fresh vegetables. Chop the carrots, celery and onion and cook them in a large pot with olive oil. Add water, a pinch of salt and some herbs, and let the soup simmer on low heat for forty minutes. Taste the soup, adjust the salt, and serve it hot with a slice of fresh bread.","The football match started with a fast attack from the home team. The striker received the ball near the penalty area and shot at the goal, but the goalkeeper made a great save. In the second half the coach changed two players, and the team scored a late goal to win the match. The fans in the stadium cheered for the players after the final whistle.","The basketball season is almost here. Our team has a new coach and two strong players joined the team this summer. The coach wants the team to play fast and defend well. In the first game of the season the team scored over a hundred points, and the fans in the arena cheered for every basket and every defensive play.","Marathon runners train for months before the race. They run long distances every weekend, eat plenty of pasta, and rest the day before the race. On race day thousands of runners crossed the starting line together, and the winner finished the course in just over two hours. The crowd cheered for every runner who crossed the finish line.","In tennis the player who serves well usually wins the match. The champion hit a powerful serve and a sharp forehand to win the first set. The crowd watched the second set closely as the challenger fought back, but the champion won the final game and lifted the trophy. The coach said the player trained hard all season.","Regular exercise is one of the best things you can do for your health. A brisk walk for thirty minutes every day strengthens your heart and improves your sleep. Doctors recommend that adults exercise at least three times a week, eat plenty of vegetables and fruit, and drink enough water. Small changes in your daily habits can improve your health and your energy over time.","Sleep is essential for good health. Most adults need seven to nine hours of sleep every night. When you sleep well, your body repairs itself, your brain stores memories, and your heart rests. Doctors advise that you avoid screens before bed, keep your room cool and dark, and go to bed at the same time every night to improve your sleep.","A healthy diet includes vegetables, fruit, whole grains and lean protein. Doctors say that too much sugar and salt can harm your heart and raise your blood pressure. Try to eat plenty of vegetables at every meal, drink water instead of sugary drinks, and visit your doctor for a regular check to keep track of your health.","Stress can affect both the mind and the body. When you feel stressed, your heart beats faster and your sleep gets worse. Doctors suggest simple habits to reduce stress, such as deep breathing, a daily walk, and talking to a friend. Regular exercise and good sleep help the body and the mind to recover, and they improve your health.","Artificial intelligence is changing the software industry. A neural network learns patterns from large amounts of data, and developers use these models to build tools for language, vision and speech. The model is trained on powerful computers, and engineers test the model carefully before they release the software to users. The data and the algorithm decide how well the model performs.","Cloud computing lets companies run software on remote ce changes every day with the news and with interest rates.","A small business needs cash to grow. The owner borrows money from the bank, pays interest on the loan, and uses the money to buy equipment and hire workers. When sales and profits rise, the business repays the loan and invests in new products. Good accounting helps the owner track income, expenses and taxes during the year.","Last summer we traveled to italy for two weeks. We flew to rome, visited the old city, and walked along the ancient streets near the famous square. The hotel was close to the train station, so we took the train to florence and then to venice. The food was wonderful, and the people at the hotel gave us good advice for the trip.","Planning a trip starts with choosing a destination and booking the flight. Compare the prices of tickets, read reviews of the hotel, and check if you need a passport or a visa. Pack light, bring a map of the city, and take the train or the bus to see the sights. A good trip needs a plan, but leave some time to explore.","The beach resort in the south is perfect for a family holiday. The hotel has a big pool, and the beach is only a short walk from the room. In the morning we went swimming, in the afternoon we visited a small village, and in the evening we ate fresh fish at a restaurant by the sea. The trip was relaxing and the weather was sunny.","Backpacking across the country was the best trip of my life. I carried a small bag, stayed in cheap hostels, and met travelers from all over the world. We took the bus to the mountains, hiked to a lake, and took the train to the coast. Every city had a museum, a market and a friendly street full of local food.","The band released a new album this week. The singer wrote the lyrics, the guitarist composed the melody, and the drummer kept the rhythm. The album has ten songs, and the first single is already popular on the radio. The band will go on tour next month and will play the new songs at concerts in many cities."
