function noteEd(id){const n=S.notes.find(x=>x.id===id);if(!n)return;ov(`<div class="md sm"><div class="sp2" style="padding:24px"><textarea id="ne" rows="8" class="ta">${esc(n.x)}</textarea><div class="cr"><span class="tmx">${new Date(n.ts||Date.now()).toLocaleString()}</span><button class="btn k" data-a="cls">Done</button></div></div></div>`);const t=$('#ne');t.focus();t.oninput=()=>{n.x=t.value;save()}}
function ask(t,v,cb){ov(`<div class="md sm"><div class="sp2" style="padding:24px"><b>${t}</b><input id="ai" class="in" maxlength="30" value="${esc(v)}"><div class="cr"><span></span><button class="btn k" id="ag">Save</button></div></div></div>`);const i=$('#ai'),go=()=>{const x=i.value.trim();closeOv();cb(x)};i.focus();i.onkeydown=e=>{if(e.key==='Enter')go()};$('#ag').onclick=go}
function addNote(){const t=$('#nt'),x=t&&t.value.trim();if(!x)return;S.notes.push({id:uid(),x,pin:0,tag:'',ts:Date.now()});save();view();$('#nt').focus()}
/* editor */
function closeMenu(){menu&&menu.remove();menu=null}
function showMenu(el,its,pick){closeMenu();const r=el.getBoundingClientRect();menu=document.createElement('div');menu.className='menu';menu.style.left=Math.min(r.left,innerWidth-230)+'px';menu.style.top=Math.min(r.bottom+4,innerHeight-310)+'px';menu.innerHTML=its.map((t,i)=>`<button data-mi="${i}" class="${i?'':'on'}">${t[1]}</button>`).join('')||'<div style="padding:8px;color:var(--mu)">No match</div>';menu._p=pick;menu._i=its;document.body.append(menu)}
function focusB(id,end=1){const e=document.querySelector(`#ed [data-id="${id}"]`);if(!e||!e.isContentEditable)return;e.focus();const r=document.createRange();r.selectNodeContents(e);r.collapse(!end);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function setType(b,t){const p=pg(V.id),i=p.blocks.indexOf(b);b.t=t;b.x=b.x.replace(/^(#{1,3}|-|\[\]|>|1\.)(&nbsp;|\s)/,'');if(t==='hr'){b.x='';p.blocks.splice(i+1,0,B())}p.ed=Date.now();save();view();focusB(p.blocks[i+(t==='hr'?1:0)].id)}
document.addEventListener('input',e=>{const t=e.target;
if(t.id==='nq'){V.q=t.value;$('#nf').innerHTML=feedHTML(noteList(),'No notes yet.');return}
if(t.id==='sq'){srch(t.value);return}
const p=pg(V.id);if(!p)return;
if(t.id==='ttl'){p.title=t.textContent;p.ed=Date.now();save();return}
const el=t.closest&&t.closest('.bl');if(!el)return;const b=p.blocks.find(x=>x.id===el.dataset.id);if(!b)return;b.x=el.innerHTML;p.ed=Date.now();save();if(b.t==='tbl')return;
const tx=el.textContent.replace(/\u00a0/g,' '),md={'# ':'h1','## ':'h2','### ':'h3','- ':'b','* ':'b','[] ':'todo','> ':'q','1. ':'n'},hit=Object.keys(md).find(k=>tx===k);
if(hit){b.x='';return setType(b,md[hit])}
if(tx.startsWith('```')&&b.t==='p'){b.x='';return setType(b,'k')}
const m=tx.match(/\/(\w*)$/);if(m&&b.t!=='k'){const it=TY.filter(x=>x[1].toLowerCase().includes(m[1].toLowerCase()));showMenu(el,it,i=>{b.x=el.innerHTML.replace(/\/\w*$/,'');setType(b,it[i][0])})}else closeMenu()});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset||{};
if(d.chk){const p=pg(d.pid||V.id),b=p&&p.blocks.find(x=>x.id===d.chk);if(!b)return;b.c=t.checked?1:0;p.ed=Date.now();save();if(V.v==='todos')render();else{t.parentElement.classList.toggle('done',!!b.c);const n=$('.nw');if(n)render()}return}
if(d.s){S.set[d.s]=['zoom','w','ban'].includes(d.s)?+t.value:t.value;save();applyTheme();if(d.s==='theme')render()}});
document.addEventListener('paste',e=>{const t=e.target;if(!(t.id==='ttl'||(t.closest&&t.closest('.bl'))))return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
document.addEventListener('keydown',e=>{
if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();return search()}
if(e.key==='Escape'){closeMenu();closeOv();return}
if(e.target.id==='nt'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();return addNote()}
if(e.target.id==='sq'&&e.key==='Enter'){const b=$('#sr .si');b&&b.click();return}
const p=pg(V.id);
if(e.target.id==='ttl'&&e.key==='Enter'){e.preventDefault();return p&&p.blocks.length&&focusB(p.blocks[0].id,0)}
if(menu){const bs=[...menu.querySelectorAll('button')],i=bs.findIndex(b=>b.classList.contains('on'));
if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();bs[i]&&bs[i].classList.remove('on');bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].classList.add('on');return}
if(e.key==='Enter'&&bs.length){e.preventDefault();const f=menu._p,k=+bs[i].dataset.mi;closeMenu();return f(k)}}
const el=e.target.closest&&e.target.closest('.bl');if(!el||!p)return;const bl=p.blocks,i=bl.findIndex(x=>x.id===el.dataset.id),b=bl[i];if(!b)return;if(b.t==='tbl'){tblKey(e,el);return}
if(e.key==='Enter'&&!e.shiftKey&&b.t!=='k'){e.preventDefault();if(['b','n','todo'].includes(b.t)&&!el.textContent){b.t='p';save();view();return focusB(b.id)}const nb=B(['b','n','todo'].includes(b.t)?b.t:'p');bl.splice(i+1,0,nb);save();view();focusB(nb.id)}
if(e.key==='Backspace'&&!el.textContent&&bl.length>1){e.preventDefault();if(b.t!=='p'){b.t='p';save();view();return focusB(b.id)}bl.splice(i,1);save();view();focusB(bl[Math.max(0,i-1)].id)}});
/* clicks */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-fmt],[data-mi]'),m=e.target.closest('.menu');
if(m&&m._i&&t&&t.dataset.mi!==undefined){const f=m._p,k=+t.dataset.mi;closeMenu();return f(k)}
if(!t){if(!m)closeMenu();return}const d=t.dataset,id=d.id;
if(d.fmt){if(d.fmt==='code')document.execCommand('insertHTML',false,'<code>'+esc(getSelection().toString())+'</code>');else document.execCommand(d.fmt,false,null);const el=document.activeElement,p=pg(V.id),b=p&&el&&p.blocks.find(x=>x.id===el.dataset.id);if(b){b.x=el.innerHTML;save()}return}
switch(d.a){
case'tog':innerWidth>800?document.body.classList.toggle('sbc'):document.body.classList.toggle('so');break;
case'go':V={v:d.v};document.body.classList.remove('so');render();break;
case'open':rmOv();V={v:'page',id};document.body.classList.remove('so');render();break;
case'np':{rmOv();const p=newPage();V={v:'page',id:p.id};document.body.classList.remove('so');render();setTimeout(()=>{const x=$('#ttl');x&&x.focus()},50);break}
case'nn':V={v:'notes'};render();setTimeout(()=>{const x=$('#nt');x&&x.focus()},50);break;
case'note':rmOv();noteEd(id);break;
case'cls':closeOv();break;
case'addn':addNote();break;
case'search':search();break;
case'set':openSet(d.t);break;
case'tab':openSet(d.t);break;
case'name':ask('Display name',S.p.name||'',x=>{S.p.name=x;save();view()});break;
case'theme':S.set.theme=S.set.theme==='dark'?'light':'dark';save();render();break;
case'ban':S.set.ban=0;save();view();break;
case'bell':{const n=openTodos();toast(n?n+' open to-do'+(n>1?'s':''):'You’re all caught up.');break}
case'help':toast('Type / in a page for blocks. Press Ctrl K to search.');break;
case'copy':{const tx=d.k==='p'?(()=>{const p=pg(id);return p.title+'\n'+p.blocks.map(bt).join('\n')})():S.notes.find(n=>n.id===id).x;navigator.clipboard.writeText(tx).then(()=>toast('Copied')).catch(()=>toast('Copy isn’t available here.'));break}
case'flag':if(d.k==='p'){const i=S.fav.indexOf(id);i<0?S.fav.push(id):S.fav.splice(i,1)}else{const n=S.notes.find(x=>x.id===id);n.pin=n.pin?0:1}save();view();break;
case'del':if(d.k==='p'){const p=pg(id);p.del=1;save();toast('Moved to trash',()=>{p.del=0;save();render()});if(V.v==='page')V={v:'pages'};render()}else{const i=S.notes.findIndex(x=>x.id===id),n=S.notes[i];S.notes.splice(i,1);save();toast('Note deleted',()=>{S.notes.push(n);save();view()});view()}break;
case'rest':pg(id).del=0;save();render();break;
case'purge':S.pages.splice(S.pages.findIndex(p=>p.id===id),1);save();render();break;
case'empty':if(confirm('Delete everything in the trash forever?')){S.pages=S.pages.filter(p=>!p.del);save();render()}break;
case'expall':dl('quill-export.json',JSON.stringify({pages:S.pages,notes:S.notes,fav:S.fav},null,2),'application/json');break;
case'expn':dl('quill-notes.txt',S.notes.slice().sort((a,b)=>b.ts-a.ts).map(n=>n.x).join('\n\n---\n\n'),'text/plain');break;
case'expp':exportMenu(t);break;
case'xmd':{closeMenu();const p=pg(V.id);dl((p.title||'page')+'.md',mdOf(p),'text/markdown');break}
case'xdocx':{closeMenu();const p=pg(V.id);dl((p.title||'page')+'.docx',docx(p),'application/vnd.openxmlformats-officedocument.wordprocessingml.document');break}
case'xpdf':closeMenu();pdfPage(pg(V.id),'simple');break;
case'xpdfp':closeMenu();pdfPage(pg(V.id),'pro');break;
case'chart':chEdit(id);break;
case'xgdoc':{closeMenu();const p=pg(V.id);window.open('https://docs.new','_blank');try{navigator.clipboard.write([new ClipboardItem({'text/html':new Blob(['<h1>'+esx(p.title||'Untitled')+'</h1>'+pageHTML(p,'gdoc')],{type:'text/html'}),'text/plain':new Blob([p.title+'\n\n'+p.blocks.map(bt).join('\n')],{type:'text/plain'})})]).then(()=>toast('Copied. Press Ctrl+V in the new Google Doc.')).catch(()=>toast('Couldn’t copy. Try Word or Markdown instead.'))}catch(e){toast('Couldn’t copy. Try Word or Markdown instead.')}break}
case'clear':if(confirm('Delete all pages, notes and settings on this device?')){localStorage.removeItem(K);location.reload()}break}});
render();
